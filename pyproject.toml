[project]
name = "asm"
version = "0.1.0"
description = "Local harness for a long-term 1:1 LLM companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "websockets>=14.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
asr = [
    "sherpa-onnx>=1.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "backend"]
include = ["asm*", "memory*", "embodiment*"]

[tool.setuptools.package-data]
memory = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["backend", "."]
markers = [
    "integration: hits the network or requires API keys",
]
