<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASM</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ASM</h1>
        <div class="meta">
          <span id="caps">听… · 说…</span>
          <span id="status" data-state="idle">idle</span>
          <button id="mic" type="button" data-open="0">开麦</button>
        </div>
      </header>
      <div id="stage">
        <div id="face-stage">
          <canvas id="face" aria-label="companion"></canvas>
          <p id="face-status">加载形象…</p>
          <p id="face-debug" hidden></p>
        </div>
        <ol id="log"></ol>
      </div>
      <form id="composer">
        <input id="input" type="text" autocomplete="off" placeholder="说点什么…" />
        <button type="submit">发送</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
